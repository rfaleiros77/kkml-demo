<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Released Costs - Cost Component Matrix</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body > div[data-name="kkml.releasedmatrix"],
        .sapUiComponentContainer,
        .sapUiComponentContainer > div,
        .sapUiView,
        .sapMNav {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-language="en"
        data-sap-ui-resourceroots='{"kkml.releasedmatrix": "./"}'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
    ></script>
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="kkml.releasedmatrix"
        data-id="container"
        data-settings='{"id" : "kkml.releasedmatrix"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
